name: Deploy to S3 and CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger a deploy manually from the Actions tab

# Required for OIDC. Without id-token: write the role assumption fails with
# a confusing "Not authorized to perform sts:AssumeRoleWithWebIdentity".
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Long-lived, immutable assets. Cached for a year; busted by the ?v=
      # query string in index.html. --delete removes objects from S3 that no
      # longer exist locally, which keeps the bucket honest.
      - name: Sync JavaScript
        run: |
          aws s3 sync js/ s3://${{ vars.grand-line-items }}/js/ \
            --content-type "application/javascript" \
            --cache-control "max-age=31536000,public" \
            --delete

      - name: Sync assets
        run: |
          aws s3 sync assets/ s3://${{ vars.grand-line-items }}/assets/ \
            --cache-control "max-age=31536000,public" \
            --delete

      # index.html must always revalidate, because it is the file that
      # carries the ?v= version numbers for everything else.
      - name: Upload index.html
        run: |
          aws s3 cp index.html s3://${{ vars.grand-line-items }}/index.html \
            --content-type "text/html" \
            --cache-control "no-cache,must-revalidate"

      # Only index.html needs invalidating. The versioned JS and assets are
      # already unique cache keys, so they can never go stale.
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.E3QIDCV5WVW6QT }} \
            --paths "/index.html" "/"
