<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Line Run - Phaser Edition</title>

    <script defer src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <!-- Bump the version on every file you change, not just GameData.
         S3/CloudFront will happily serve a cached GameScene.js against a
         fresh GameData.js, which produces very confusing half-updated bugs. -->
    <script defer src="js/GameData.js?v=1.4"></script>
    <script defer src="js/TitleScene.js?v=1.4"></script>
    <script defer src="js/GameScene.js?v=1.4"></script>
    <script defer src="js/main.js?v=1.4"></script>
    <script defer src="js/Auth.js?v=1.4"></script>

    <style>
        html, body {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        canvas {
            display: block;
            border: none;
            outline: none;
        }

        /* The 5px orange border was the visible edge, and it also pushed the
           container 10px past the viewport, so Scale.FIT measured a parent
           larger than the window. No border, no padding, and the container
           centres the canvas in the full viewport. */
        #game-container {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            border: none;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
</body>
</html>
