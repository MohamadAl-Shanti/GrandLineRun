<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Line Run - Phaser Edition</title>
 
    <script defer src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
 
    <!-- Load order matters: Auth and Scores define globals the scenes use,
         and main.js awaits Auth.init() before booting Phaser.
         Bump the version on every file you change. -->
    <script defer src="js/Auth.js?v=1.5"></script>
    <script defer src="js/Scores.js?v=1.5"></script>
    <script defer src="js/GameData.js?v=1.5"></script>
    <script defer src="js/TitleScene.js?v=1.5"></script>
    <script defer src="js/GameScene.js?v=1.5"></script>
    <script defer src="js/main.js?v=1.5"></script>
 
    <style>
        html, body {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }
 
        canvas {
            display: block;
            border: none;
            outline: none;
        }
 
        #game-container {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            border: none;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
</body>
</html>
